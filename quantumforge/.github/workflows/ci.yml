name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root
        run: npm install
      - name: Install client
        run: cd client && npm install
      - name: Test backend
        run: npm test --workspace-root=false
      - name: Build client
        run: cd client && npm run build